name: Site

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and one in progress is never cancelled halfway, so
# the published site is always one whole build. Pull request runs replace each other.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Fetch the data, build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch contributions, commits and repo details from GitHub
        run: bun run fetch-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: bun run build
      - name: Type-check
        run: bun run check
      - name: Configure Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload the site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Only master publishes, on a push, the hourly schedule or a manual run. A pull request builds and checks, and stops there.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
